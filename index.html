<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XII Equipment Editor Professional</title>
    <link rel="icon" type="image/png" href="faviconff12.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Drag & Drop Overlay -->
    <div class="drop-zone-overlay" id="dropZone">
        <div class="drop-zone-content">
            <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="var(--magitek)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/>
            </svg>
            <h2>Aetherial Transfer</h2>
            <p>Drop your JSON grimoire here</p>
        </div>
    </div>

    <div class="container" id="mainContainer">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                <h3>Magick Presets</h3>
                <div class="lang-switcher">
                    <button id="langPt" class="lang-btn">PT</button>
                    <span style="color: var(--border)">|</span>
                    <button id="langEn" class="lang-btn">EN</button>
                </div>
            </div>
            <p>Select a paradigm to reshape all loaded artifacts instantly.</p>
            <div id="presetList" class="preset-list">
                <!-- Injected via JS -->
            </div>
            <div class="sidebar-actions">
                <button class="btn btn-secondary" id="importBtn">Upload Grimoire</button>
                <button class="btn" id="exportBtn">Export Lua</button>
            </div>

            <div class="scale-factor-section">
                <div class="factor-header">
                    <label id="labelScaleFactor">Aetherial Scale Factor</label>
                    <input type="number" id="factorInput" value="1.00" min="1.00" max="3.00" step="0.01">
                </div>
                <input type="range" id="factorSlider" min="1.00" max="3.00" step="0.01" value="1.00">
                <button class="btn" id="applyFactorBtn" style="margin-top: 0.5rem; width: 100%; font-size: 0.7rem;">Apply Factor Globally</button>
            </div>
        </aside>

        <!-- Main Workspace -->
        <main class="main-content">
            <header>
                <div class="title">Equipment Editor <span>Pro</span></div>
                <div class="search-field">
                    <input type="text" id="searchInput" placeholder="Search by name, ID or category...">
                </div>
            </header>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th style="width: 80px;">Icon</th>
                            <th style="width: 80px;">ID</th>
                            <th>Artifact Name</th>
                            <th>License</th>
                            <th>Category</th>
                            <th>Elements</th>
                            <th style="width: 100px;">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="itemBody">
                        <!-- Content injected via JS -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <input type="file" id="fileInput" style="display:none" accept=".json">

    <!-- Editor Modal -->
    <div class="modal-overlay" id="editModal">
        <div class="modal-content">
            <div class="modal-header">
                <div style="display: flex; align-items: center;">
                    <h2 id="modalItemName">Artifact Name</h2>
                    <span id="modalItemCat" class="category-badge">Category</span>
                </div>
                <button id="closeModal" style="background: none; border: none; color: var(--text-secondary); cursor: pointer; font-size: 2rem; transition: color 0.2s;">&times;</button>
            </div>
            
            <div class="modal-tabs">
                <button class="tab-btn active" data-tab="details">Overview</button>
                <button class="tab-btn" data-tab="attributes">Scaling</button>
                <button class="tab-btn" data-tab="augment">Augments</button>
                <button class="tab-btn" data-tab="on-equip">On-Equip</button>
                <button class="tab-btn" data-tab="immunity">Immunity</button>
                <button class="tab-btn" data-tab="affinity">Affinity</button>
            </div>

            <div class="modal-body">
                <div class="tab-pane active" id="detailsTab">
                    <div style="display: flex; gap: 3rem;">
                        <div style="padding: 1rem; background: var(--void); border-radius: 12px; border: 1px solid var(--border);">
                            <img id="modalItemImg" src="" style="width: 180px; height: 180px; object-fit: contain; filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5));">
                        </div>
                        <div style="flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; align-content: start;">
                            <div class="scale-input"><label for="detailName">Nomenclature</label><input type="text" id="detailName" readonly style="color: var(--gold); border-color: var(--border);"></div>
                            <div class="scale-input"><label for="detailCategory">Classification</label><input type="text" id="detailCategory" readonly></div>
                            <div class="scale-input"><label for="detailLicense">License Required</label><input type="text" id="detailLicense" readonly></div>
                            <div class="scale-input"><label for="detailID">Registry ID</label><input type="text" id="detailID" readonly></div>
                        </div>
                    </div>
                </div>

                <div class="tab-pane" id="attributesTab"><div id="attributesList"></div></div>
                <div class="tab-pane" id="augmentTab"><div id="augmentsList" class="grid-selector"></div></div>
                <div class="tab-pane" id="onEquipTab"><div id="onEquipList" class="grid-selector"></div></div>
                <div class="tab-pane" id="immunityTab"><div id="immunityList" class="grid-selector"></div></div>
                
                <div class="tab-pane" id="affinityTab">
                    <div id="affinityList" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;"></div>
                </div>
            </div>

            <div class="modal-footer">
                <button class="btn btn-secondary" id="discardBtn">Discard</button>
                <button class="btn" id="saveBtn">Imprint Changes</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
